<style>
:root{--bg:#fffaf0;--fg:#1a1a1a;--card:#ffffff;--pri:#1f4e8c;--pritxt:#ffffff;--ok:#1b7a35;--bad:#b3261e;--line:#d9cfb8;--mut:#4a4a4a;--soft:#eef3fb;--pink:#fdeaf1;--pinkl:#e7a6c1;--blue:#eaf2fd;--bluel:#9dbde8;--gold:#fff8e4;--goldl:#e8cf86;--red:#c0392b}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 화면 높이·폭 중 작은 쪽에 맞춰 글자 크기를 정해 갤럭시 한 화면에 들어가게 함 */
html{font-size:calc(clamp(13px,min(4.5vw,2.25dvh),21px)*var(--fs,1));height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.4;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hj{font-family:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang","Songti SC","MingLiU","SimSun",serif}
main{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:max(.6rem,env(safe-area-inset-top)) .8rem .5rem;display:flex;flex-direction:column;overflow:hidden}
.fill{flex:1;min-height:0}
.scroll{overflow-y:auto;overscroll-behavior:contain}
h1{font-size:1.4rem;margin:0 0 .4rem;line-height:1.25}
h1 small{font-size:.75rem;font-weight:700;color:var(--mut);margin-left:.3rem}
p{margin:.3rem 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:3rem;margin:.35rem 0;padding:.4rem .7rem;font-size:1.1rem;font-weight:700;border-radius:.9rem;border:2px solid var(--pri);background:var(--card);color:var(--pri);text-align:center;line-height:1.25}
.btn.pri{background:var(--pri);color:var(--pritxt)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn small{display:block;font-weight:400;font-size:.78rem;opacity:.9}
.btn.sm{min-height:2.6rem;font-size:1rem}
.row{display:flex;gap:.5rem}
.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.35rem 0}
.grid2 .btn{margin:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:.6rem .8rem;margin:.35rem 0}
.bar{height:.8rem;background:var(--line);border-radius:1rem;overflow:hidden;margin-top:.3rem}
.bar>i{display:block;height:100%;background:var(--ok)}
.mut{color:var(--mut);font-size:.85rem}
.ctr{text-align:center}
nav{flex:none;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:3.5rem;border:0;background:none;font-size:.85rem;font-weight:700;color:var(--mut);line-height:1.15}
nav button b{display:block;font-size:1.3rem}

.big{line-height:1.1;margin:0}
.hun{font-size:1.5rem;font-weight:800;line-height:1.25;word-break:keep-all}
.hun .um{color:var(--red);font-weight:900;font-size:1.9rem;margin-left:.3rem}
.sub{font-size:.88rem;color:var(--mut)}
.kind{display:inline-block;background:var(--red);color:#fff;border-radius:.5rem;padding:0 .5rem;font-weight:800;font-size:.85rem;margin-right:.3rem}
.parts{font-size:.95rem;font-weight:700;margin:.1rem 0 .4rem;word-break:keep-all}
.box{border-radius:.9rem;padding:.5rem .7rem;margin:.4rem 0;text-align:left}
.box .lb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:.5rem;padding:0 .5rem;margin-bottom:.2rem;color:#fff}
.ori{background:var(--pink);border:2px solid var(--pinkl)}.ori .lb{background:#c2477a}
.ori p{margin:0;font-size:1rem;line-height:1.55;word-break:keep-all}
.wd{background:var(--blue);border:2px solid var(--bluel)}.wd .lb{background:var(--pri);color:var(--pritxt)}
.wd .w{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .5rem;padding:.25rem 0;border-bottom:1px dotted var(--bluel)}
.wd .w:last-child{border:0}
.wd .w b{font-size:1.35rem}.wd .w i{font-style:normal;font-weight:800;color:var(--red);font-size:1.05rem}.wd .w span{font-size:.92rem}
.rel{background:var(--gold);border:2px solid var(--goldl)}.rel .lb{background:#b9851a}
.rel .rl{font-size:.88rem;font-weight:800;color:#8a6410;margin:.3rem 0 0}

.rel .it b{display:block;font-size:1.7rem;line-height:1.1;font-weight:700}
.rel .it span{font-size:.8rem}
.tabs{display:flex;gap:.35rem;margin:.35rem 0 .1rem}
.tabs button{flex:1;min-height:2.4rem;border:2px solid var(--pri);border-radius:.7rem;background:var(--card);color:var(--pri);font-weight:800;font-size:.92rem;padding:0 .2rem}
.tabs button.on{background:var(--pri);color:var(--pritxt)}
.tabs button:disabled{opacity:.35}
.tabbody .box{margin-top:.3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.opts button{min-height:max(3.4rem,11dvh);padding:.3rem;font-size:1.25rem;font-weight:700;border-radius:.9rem;border:2px solid var(--line);background:var(--card);word-break:keep-all;line-height:1.2}
.opts.hj button{font-size:min(13vw,7.5dvh);line-height:1.1}
.opts button.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.qcard{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:.3rem 0 .5rem;padding:.4rem}
.q{font-size:1.25rem;font-weight:800}
.fb{font-size:1.05rem;font-weight:800;text-align:center;margin:.35rem 0 0;min-height:2.9rem;line-height:1.3;word-break:keep-all}
.fb .sub{font-weight:400}
.nx{min-height:3.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.chips button{min-height:2.4rem;padding:0 .75rem;border:2px solid var(--pri);border-radius:2rem;background:var(--card);color:var(--pri);font-weight:700;font-size:.9rem}
.chips button.on{background:var(--pri);color:var(--pritxt)}
input[type=search]{width:100%;font:inherit;font-size:1.1rem;padding:.55rem .9rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.item{padding:.45rem .2rem;border-bottom:1px solid var(--line)}
.item .top{display:flex;align-items:center;gap:.8rem}
.item .c{font-size:2.3rem;min-width:3rem;text-align:center;line-height:1.15}
.item .t{font-size:1.05rem;font-weight:700}
.item .u{font-size:.8rem;color:var(--mut)}
.item .more{display:none}.item.open .more{display:block}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--line);margin-left:.3rem;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
.daybar{display:flex;align-items:center;gap:.5rem}
.daybar button{width:3rem;min-height:3rem;font-size:1.3rem;font-weight:800;border-radius:.9rem;border:2px solid var(--pri);background:var(--card);color:var(--pri)}
.daybar div{flex:1;text-align:center;font-size:1.3rem;font-weight:800;white-space:nowrap}.daybar div span{font-size:.9rem}
.today{text-align:center;font-size:1.45rem;letter-spacing:.12rem;margin:.25rem 0 0;line-height:1.3}
.top-line{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mut);min-height:1.6rem}
.top-line button{border:0;background:none;color:var(--pri);font-weight:800;padding:.2rem .4rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal .panel{max-width:520px;width:100%}
.modal li{margin:.3rem 0}
</style>
</head>

}
function save(){try{localStorage.setItem('hj3',JSON.stringify(S))}catch(e){}}

const first=a=>a&&a[0]?a[0]:'';

function dayList(n){return D.filter(d=>d.day===n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){
  if(!S.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.8;speechSynthesis.speak(u)}catch(e){}
}
function mastered(){return D.filter(d=>(S.p[d.h]||{}).lv>=2).length}

function partWords(d){
  if(!d.words.length)return '';
  return `<div class="box wd"><span class="lb">주요 한자어 <small>(누르면 소리)</small></span>${d.words.map(w=>`<div class="w" onclick="speak('${esc(w.r)}')"><b class="hj">${esc(w.w)}</b><i>${esc(w.r)}</i><span>${esc(w.m)}</span></div>`).join('')}</div>`;
}
function partRel(d){
  const it=a=>a.map(x=>`<div class="it"><b class="hj">${x.h}</b><span>${esc(x.k)}</span></div>`).join('');
  let rel='';
  if(d.sim.length)rel+=`<div class="rl">비슷하게 생긴 글자 (헷갈려요!)</div>${it(d.sim)}`;
  if(d.same.length)rel+=`<div class="rl">뜻이 같은 글자</div>${it(d.same)}`;
  if(d.opp)rel+=`<div class="rl">뜻이 반대인 글자</div>${it([d.opp])}`;
  return rel?`<div class="box rel"><span class="lb">함께 알아두기</span>${rel}</div>`:'';
}
function detail(d){return partOri(d)+partWords(d)+partRel(d)}

let view='home';
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));stopTimer();R[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function modal(html){$('#modal').innerHTML=html?`<div class="modal" onclick="if(event.target===this)modal('')"><div class="panel">${html}<button class="btn pri" onclick="modal('')">닫기</button></div></div>`:''}

const R={};
/* ---------- 홈 ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='home')R.home()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(view==='home')R.home()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;

function installHelp(){modal(`<b>설치하면 아이콘으로 바로 열려요 (인터넷 없이도 가능)</b><ol>

  <p>선정한자 1,000자(8급 30 → 7급 50 → 6급 70 → 준5급 100 → 5급 250 → 준4급 400 → 4급 600 → 준3급 800 → 3급 1,000자 누적) · 객관식 ${MOCK_N}문항 · ${MOCK_MIN}분</p>
  <p>하루 10자씩 100일 과정이며, 급수 순서대로 배치했어요.</p>
  <p class="mut">글자 풀이·한자어는 학습 편의를 위해 정리한 내용입니다. 선정한자 목록은 대한검정회 '등급별 선정한자'를 따랐습니다.</p>`)}
function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;R.home()})}
function chDay(n){S.day=Math.min(MAXDAY,Math.max(1,S.day+n));save();R.home()}
function setFs(v){S.fs=v;save();applyFs();R.home()}

/* ---------- 외우기 ---------- */
let Z={list:[],i:0,shown:false,tab:'w'};
function startStudy(){Z={list:dayList(S.day),i:0,shown:false,tab:'w'};go('study')}
R.study=()=>{
  if(!Z.list.length)Z={list:dayList(S.day),i:0,shown:false,tab:'w'};
  if(Z.i>=Z.list.length){
    $('#main').innerHTML=`<div class="fill scroll"><h1>🎉 ${S.day}일차 끝!</h1>
    <p style="font-size:1.15rem">수고하셨어요. 이제 퀴즈로 확인해 볼까요?</p>
    <button class="btn pri" onclick="startQuiz('day','h2m')">✏️ 오늘 퀴즈 풀기</button>
    <button class="btn" onclick="startQuiz('day','w2r')">📝 한자어 독음 퀴즈</button>
    <button class="btn" onclick="Z.i=0;Z.shown=false;R.study()">처음부터 다시 보기</button>
    ${S.day<MAXDAY?`<button class="btn" onclick="S.day++;save();startStudy()">다음 ${S.day+1}일차 시작 ▶</button>`:''}</div>`;
    return;
  }
  const d=Z.list[Z.i];
  const tabs=[['w','한자어',partWords(d)],['o','글자 풀이',partOri(d)],['r','함께 알기',partRel(d)]];
  if(!tabs.find(t=>t[0]===Z.tab)[2])Z.tab=(tabs.find(t=>t[2])||tabs[0])[0];
  const big=Z.shown?'min(30vw,17dvh)':'min(56vw,30dvh)';
  $('#main').innerHTML=`
  <div class="top-line"><span>${S.day}일차 · ${Z.i+1} / ${Z.list.length} · ${d.lv}</span><span>부수 ${esc(d.r)} · ${d.ts}획</span></div>
  <div class="panel ctr" style="margin-top:.2rem">
    <div class="big hj" style="font-size:${big}">${d.h}</div>
    ${Z.shown?`<div class="hun">${esc(d.m[0][0].join(', '))}<span class="um">${esc(d.m[0][1][0])}</span></div>
      ${d.m.length>1?`<div class="sub">다른 뜻·음: ${esc(d.m.slice(1).map(([k,s])=>k.join(', ')+' '+s.join(', ')).join(' / '))}</div>`:''}`
      :`<div class="sub">먼저 뜻과 소리를 떠올려 보세요</div>`}
  </div>
  ${Z.shown?`<div class="tabs">${tabs.map(([k,t,h])=>`<button class="${Z.tab===k?'on':''}" ${h?'':'disabled'} onclick="Z.tab='${k}';R.study()">${t}</button>`).join('')}</div>
    <div class="fill scroll tabbody">${tabs.find(t=>t[0]===Z.tab)[2]}</div>`
   :`<div class="fill"></div>`}
  ${Z.shown?`<div class="row">
      <button class="btn bad" onclick="mark(false)">😕 다시</button>
      <button class="btn ok" onclick="mark(true)">😊 알겠어요</button></div>`
   :`<button class="btn pri" onclick="Z.shown=true;R.study();speak(lab(Z.list[Z.i]))">뜻 보기</button>`}
  <div class="row">
    <button class="btn sm" onclick="if(Z.i>0){Z.i--;Z.shown=false;R.study()}">◀ 이전</button>
    ${Z.shown?`<button class="btn sm" onclick="speak(lab(Z.list[Z.i]))">🔊</button>`:''}
    <button class="btn sm" onclick="Z.i++;Z.shown=false;R.study()">다음 ▶</button>
  </div>`;
};
function mark(ok){
  const d=Z.list[Z.i],p=P(d.h);
  if(ok)p.lv=Math.max(p.lv,1);else{p.lv=0;p.w=Math.max(p.w,1)}
  save();Z.i++;Z.shown=false;R.study();
}

/* ---------- 퀴즈 ---------- */
let Q=null,timer=null;
const ALLWORDS=D.flatMap(d=>d.words.map(w=>({...w,h:d.h})));
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
R.quiz=()=>{
  if(Q&&Q.active&&Q.i<Q.items.length){return quizQ()}
  $('#main').innerHTML=`<div class="fill scroll"><h1>퀴즈</h1>
  <button class="btn pri" onclick="startQuiz('day','h2m')">오늘(${S.day}일차) 한자 → 뜻·소리<small>한자를 보고 뜻과 소리 고르기</small></button>
  <button class="btn" onclick="startQuiz('day','w2r')">오늘(${S.day}일차) 한자어 → 독음<small>낱말 읽기</small></button>
  <button class="btn" onclick="startQuiz('day','m2h')">오늘(${S.day}일차) 뜻·소리 → 한자<small>뜻과 소리를 보고 한자 고르기</small></button>
  <div class="grid2">
    <button class="btn" onclick="startQuiz('upto','h2m')">1~${S.day}일차<small>섞어서 20문제</small></button>
    <button class="btn" onclick="startQuiz('upto','w2r')">1~${S.day}일차<small>독음 20문제</small></button>
    <button class="btn" onclick="startQuiz('wrong','h2m')">틀린 글자만<small>${wrongList().length}자</small></button>
    <button class="btn" onclick="startQuiz('all','mix')">전체 ${D.length}자<small>섞어서 20문제</small></button>
  </div>
  <button class="btn pri" onclick="startQuiz('mock','mix')">📝 실전 모의 ${MOCK_N}문제 · ${MOCK_MIN}분<small>1~${S.day}일차 범위 · 세 가지 유형 섞어서</small></button></div>`;
};
function startQuiz(scope,mode){
  let pool;
  if(scope==='day')pool=dayList(S.day);
  else if(scope==='upto'||scope==='mock')pool=D.filter(d=>d.day<=S.day);
  else if(scope==='wrong')pool=wrongList();
  else pool=D;
  if(mode==='w2r')pool=pool.filter(d=>d.words.length);
  if(!pool.length){alert('풀 문제가 없어요. 먼저 한자를 외워 보세요!');go('home');return}
  const n=scope==='day'?pool.length:Math.min(scope==='mock'?MOCK_N:20,pool.length);
  const modes=['h2m','m2h','w2r'];
  const items=shuffle(pool).slice(0,n).map(d=>{
    let md=mode==='mix'?modes[Math.floor(Math.random()*3)]:mode;
    if(md==='w2r'&&!d.words.length)md='h2m';
    return {d,md,w:md==='w2r'?d.words[Math.floor(Math.random()*d.words.length)]:null};
  });
  Q={items,i:0,score:0,answered:false,active:true,miss:[],mock:scope==='mock',end:scope==='mock'?Date.now()+MOCK_MIN*60000:0};
  view='quiz';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==='quiz'));
  stopTimer();if(Q.mock)timer=setInterval(tick,1000);
  quizQ();
}
function left(){const s=Math.max(0,Math.round((Q.end-Date.now())/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function tick(){const el=$('#tm');if(el)el.textContent='⏱ '+left();if(Q&&Q.end&&Date.now()>=Q.end){stopTimer();Q.active=false;quizEnd(true)}}
function quizQ(){
  if(Q.i>=Q.items.length){Q.active=false;stopTimer();return quizEnd()}
  const {d,w,md}=Q.items[Q.i];
  let opts;
  if(md==='w2r'){
    const seen=new Set([w.r]);const o=[];
    for(const x of shuffle(ALLWORDS)){
      if(o.length>=3)break;
      if(x.r.length!==w.r.length||seen.has(x.r))continue;
      seen.add(x.r);o.push({t:x.r,ok:false});
    }
    opts=shuffle([{t:w.r,ok:true},...o]);
  }else{
    const used=new Set([lab(d)]);const o=[];
    for(const x of shuffle(D)){
      if(o.length>=3)break;
      const l=lab(x);
      if(x.h===d.h||used.has(l))continue;
      used.add(l);o.push(x);
    }
    opts=shuffle([d,...o]).map(x=>({t:md==='h2m'?lab(x):x.h,ok:x.h===d.h}));
  }
  Q.opts=opts;Q.answered=false;
  const head=md==='h2m'?`<div class="big hj" style="font-size:min(42vw,22dvh)">${d.h}</div><div class="q">뜻과 소리는?</div>`
    :md==='m2h'?`<div class="q" style="font-size:2rem;color:var(--pri)">${esc(lab(d))}</div><div class="sub">이 뜻과 소리의 한자는?</div>`
    :`<div class="big hj" style="font-size:min(${w.w.length>2?17:24}vw,14dvh)">${esc(w.w)}</div><div class="q">독음(읽는 법)은?</div>`;
  $('#main').innerHTML=`
  <div class="top-line"><span>${Q.i+1} / ${Q.items.length} · 맞힘 ${Q.score}</span>${Q.mock?`<b id="tm" style="color:var(--pri)">⏱ ${left()}</b>`:''}<button onclick="quitQuiz()">그만</button></div>
  <div class="panel qcard fill">${head}</div>
  <div class="opts ${md==='m2h'?'hj':''}" id="opts">
    ${opts.map((o,k)=>`<button onclick="pick(${k})">${esc(o.t)}</button>`).join('')}
  </div>
  <div class="fb" id="fb"></div>
  <div class="nx" id="nx"></div>`;
}
function quitQuiz(){if(Q.i===0||confirm('퀴즈를 그만할까요?')){stopTimer();Q.active=false;Q.items=Q.items.slice(0,Q.i);if(Q.items.length)quizEnd();else{Q=null;R.quiz()}}}
function pick(k){
  if(Q.answered)return;Q.answered=true;
  const {d,w,md}=Q.items[Q.i],ok=Q.opts[k].ok,p=P(d.h);
  const btns=[...document.querySelectorAll('#opts button')];
  btns[k].classList.add(ok?'good':'wrong');
  if(!ok)btns[Q.opts.findIndex(x=>x.ok)].classList.add('good');
  if(ok){Q.score++;p.lv=Math.min(3,p.lv+1);p.w=0}
  else{p.lv=0;p.w=(p.w||0)+1;Q.miss.push({d,w})}
  save();
  const fb=$('#fb');fb.style.color=ok?'var(--ok)':'var(--bad)';
  const ans=md==='w2r'?`<span class="hj">${esc(w.w)}</span> ${esc(w.r)} — ${esc(w.m)}`:`<span class="hj">${d.h}</span> ${esc(full(d))}`;
  fb.innerHTML=ok?`⭕ 정답!<div class="sub">${ans}</div>`:`❌ 정답: ${ans}`;
  $('#nx').innerHTML=`<button class="btn pri" style="margin:.2rem 0 0" onclick="Q.i++;quizQ()">${Q.i+1<Q.items.length?'다음 문제 ▶':'결과 보기'}</button>`;
  speak(md==='w2r'?w.r:lab(d));
}
function quizEnd(timeout){
  const pct=Math.round(Q.score/Q.items.length*100);
  $('#main').innerHTML=`<h1>${timeout?'⏰ 시간 끝!':pct>=80?'🎉 훌륭해요!':pct>=60?'👍 잘하고 있어요!':'💪 조금만 더!'}</h1>
  <div class="panel ctr"><div class="hun" style="font-size:2.2rem">${Q.score} / ${Q.items.length}</div>
  <p class="sub">${pct}점${timeout?` · ${Q.i}문제까지 풀었어요`:''}</p></div>
  ${Q.miss.length?`<div class="mut">틀린 글자</div><div class="panel fill scroll" style="padding:.2rem .6rem">${Q.miss.map(({d,w})=>`<div class="item"><div class="top"><div class="c hj">${d.h}</div><div><div class="t">${esc(full(d))}</div>${w?`<div class="u">${esc(w.w)} (${esc(w.r)}) ${esc(w.m)}</div>`:''}</div></div></div>`).join('')}</div>`:'<div class="fill"></div>'}
  <button class="btn pri" onclick="startQuiz('wrong','h2m')">🔁 틀린 글자 다시 풀기 (${wrongList().length}자)</button>
  <div class="row"><button class="btn sm" onclick="Q=null;R.quiz()">다른 퀴즈</button>
  ${S.day<MAXDAY?`<button class="btn sm" onclick="S.day++;save();startStudy()">${S.day+1}일차 시작 ▶</button>`:''}</div>`;
}

/* ---------- 한자표 ---------- */
let L={q:'',lv:''};
const LVS=[...new Set(D.map(d=>d.lv))];
R.list=()=>{
  $('#main').innerHTML=`<h1>한자표</h1>
  <input type="search" id="q" placeholder="한자·뜻·소리로 찾기" value="${esc(L.q)}">
  <div class="chips"><button class="${L.lv===''?'on':''}" data-lv="">전체</button>
  ${LVS.map(l=>`<button class="${L.lv===l?'on':''}" data-lv="${l}">${l}</button>`).join('')}</div>
  <div class="fill scroll" id="rows"></div>`;
  $('#q').oninput=e=>{L.q=e.target.value.trim();rows()};
  document.querySelectorAll('.chips button[data-lv]').forEach(b=>b.onclick=()=>{L.lv=b.dataset.lv;R.list()});
  rows();
};
function rows(){
  let a=D.filter(d=>(!L.lv||d.lv===L.lv)&&(!L.q||d.h.includes(L.q)||full(d).includes(L.q)||d.words.some(w=>w.w.includes(L.q)||w.r===L.q)));
  const more=a.length>120;a=a.slice(0,120);
  $('#rows').innerHTML=a.map(d=>{const p=S.p[d.h]||{};
    return `<div class="item" id="it${d.n}"><div class="top" onclick="toggleItem(${d.n})"><div class="c hj">${d.h}</div>
    <div><div class="t">${esc(full(d))}</div><div class="u">${d.lv} · ${d.day}일차 · 부수 ${esc(d.r)} · ${d.ts}획<span class="dot ${p.w>0?'bad':p.lv>=2?'on':''}"></span></div></div></div><div class="more"></div></div>`}).join('')
    +(more?'<p class="mut">처음 120자만 보여요. 검색하거나 급수를 눌러 좁혀 보세요.</p>':'')
    +(a.length?'':'<p>찾는 한자가 없어요.</p>');
}
function toggleItem(n){
  const el=$('#it'+n),d=D.find(x=>x.n===n),m=el.querySelector('.more');
  if(el.classList.toggle('open')){m.innerHTML=detail(d)}
  speak(lab(d));
}

applyFs();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
go('home');
</script>
